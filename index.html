<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SBF-HIZLI ÇÖZÜM-SBF REFLEKS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .active-btn { border-color: #2563eb !important; background-color: #eff6ff !important; transform: scale(0.95); }
        select { cursor: pointer; }
        optgroup { font-weight: 900 !important; color: #000 !important; font-style: normal; background-color: #f3f4f6; }
        option { font-weight: normal; color: #374151; }
        .star-rating { display: flex; gap: 8px; justify-content: center; }
        .star-btn { font-size: 2.2rem; color: #d1d5db; transition: all 0.2s; cursor: pointer; background: none; border: none; padding: 0; }
        .star-btn.active { color: #facc15; transform: scale(1.1); }
        #finalOverlay { display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.6); z-index: 1000; align-items: center; justify-content: center; padding: 20px; }
        .green-box { background: #22c55e; color: white; padding: 2rem; border-radius: 2rem; text-align: center; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); max-width: 300px; width: 100%; }
        .lang-switcher { position: absolute; top: 1rem; width: 100%; display: flex; justify-content: space-between; padding: 0 1rem; z-index: 50; }
        .lang-box { background: rgba(255,255,255,0.15); color: white; border: 1px solid rgba(255,255,255,0.4); border-radius: 0.75rem; padding: 6px 16px; font-size: 0.9rem; font-weight: 900; cursor: pointer; backdrop-filter: blur(4px); transition: all 0.2s; }
        .lang-box.active { background: white; color: #2563eb; border-color: white; }

        .chat-widget { position: fixed; bottom: 80px; right: 20px; background: #25d366; color: white; width: 55px; height: 55px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 26px; box-shadow: 0 10px 20px rgba(37, 211, 102, 0.3); cursor: pointer; z-index: 999; transition: all 0.3s; border: 2px solid white; }
        .chat-widget:hover { transform: scale(1.1); }
        .online-dot { position: absolute; top: 0px; right: 0px; width: 14px; height: 14px; background: #00ff00; border: 2px solid white; border-radius: 50%; animation: pulse-green 1.5s infinite; }
        
        @keyframes pulse-green {
            0% { transform: scale(0.9); box-shadow: 0 0 0 0 rgba(0, 255, 0, 0.7); }
            70% { transform: scale(1.1); box-shadow: 0 0 0 10px rgba(0, 255, 0, 0); }
            100% { transform: scale(0.9); box-shadow: 0 0 0 0 rgba(0, 255, 0, 0); }
        }
    </style>
</head>
<body class="p-4 bg-gray-50 flex items-center justify-center min-h-screen font-sans text-slate-700">

    <div class="chat-widget" onclick="window.location.href='https://wa.me/905427918023?text=SBF Refleks Canlı Destek: Merhaba, bir konuda bilgi alabilir miyim?'">

    <div id="finalOverlay">

        </div>
    </div>

    <div class="max-w-md w-full bg-white rounded-[2.5rem] shadow-2xl overflow-hidden relative border border-gray-100">
        <div class="lang-switcher">
            <button id="btn-tr" class="lang-box active" onclick="setLang('tr')">TR</button>
            <button id="btn-en" class="lang-box" onclick="setLang('en')">EN</button>
        </div>

        <div class="bg-blue-600 p-8 text-white text-center">
            <h1 class="text-2xl font-black tracking-tighter uppercase leading-tight pt-4 text-white" data-tr="SAĞLIK BİLİMLERİ FAKÜLTESİ" data-en="FACULTY OF HEALTH SCIENCES">SAĞLIK BİLİMLERİ FAKÜLTESİ</h1>
            <div class="mt-1">
                <p class="text-xl font-black uppercase tracking-wide leading-tight text-white" data-tr="HIZLI ÇÖZÜM >>>>> " data-en="QUICK SOLUTION >>>>> ">HIZLI ÇÖZÜM >>>>> </p>
                <p class="text-xl font-black uppercase tracking-wide leading-tight text-white" data-tr=">>>>>>SBF REFLEKS" data-en=">>>>>>SBF REFLEX">>>>>>>SBF REFLEKS</p>
            </div>
        </div>

        <form id="finalForm" class="p-8 space-y-5">
            <div class="flex flex-col gap-2.5">
                <div class="flex gap-2.5">
                    <button type="button" onclick="setIdentity(this, 'Öğrenci')" class="identity-btn flex-1 border-2 border-gray-100 rounded-xl py-3 text-[14px] font-black uppercase hover:border-blue-500 transition-all text-gray-700" data-tr="🎓 Öğrenci" data-en="🎓 Student">🎓 Öğrenci</button>
                    <button type="button" onclick="setIdentity(this, 'Personel')" class="identity-btn flex-1 border-2 border-gray-100 rounded-xl py-3 text-[14px] font-black uppercase hover:border-blue-500 transition-all text-gray-700" data-tr="💼 Personel" data-en="💼 Admin. Staff">💼 Personel</button>
                </div>
                <button type="button" onclick="setIdentity(this, 'Akademik Personel')" class="identity-btn w-full border-2 border-gray-100 rounded-xl py-3 text-[14px] font-black uppercase hover:border-blue-500 transition-all text-gray-700" data-tr="👨‍🏫 Akademik Personel" data-en="👨‍🏫 Academic Staff">👨‍🏫 Akademik Personel</button>
                <input type="hidden" id="selectedIdentity" value="Belirtilmedi">
            </div>

            <select id="loc" class="w-full bg-gray-50 border-2 border-gray-100 rounded-2xl py-4 px-4 font-bold text-gray-700 outline-none focus:border-blue-500 transition-all text-lg">
                <option value="Belirtilmedi" data-tr="📍 Birim / Yer Belirtin..." data-en="📍 Select Location...">📍 Birim / Yer Belirtin...</option>
                <option value="Fakülte Sekreterliği" data-tr="🏢 Fakülte Sekreterliği" data-en="🏢 Secretariat">🏢 Fakülte Sekreterliği</option>
                <option value="Öğrenci İşleri" data-tr="📄 Öğrenci İşleri" data-en="📄 Student Affairs">📄 Öğrenci İşleri</option>
                <option value="SBF Kantin" data-tr="☕ SBF Kantin" data-en="☕ Canteen">☕ SBF Kantin</option>
                <option value="SBF Zemin Kat" data-tr="👇 SBF Zemin Kat" data-en="👇 Ground Floor">👇 SBF Zemin Kat</option>
                <option value="SBF 1. Kat" data-tr="👆 SBF 1. Kat" data-en="👆 1st Floor">👆 SBF 1. Kat</option>
                <option value="SBF Ek Bina" data-tr="🏠 SBF Ek Bina" data-en="🏠 Annex Building">🏠 SBF Ek Bina</option>
                <option value="SBF Çevre" data-tr="🌳 SBF Çevre / Dış Alan" data-en="🌳 Outdoor Area">🌳 SBF Çevre / Dış Alan</option>
            </select>

            <select id="selectedType" class="w-full bg-gray-50 border-2 border-gray-100 rounded-2xl py-4 px-4 font-bold text-gray-700 outline-none focus:border-blue-500 transition-all text-lg">
                <option value="Belirtilmedi" data-tr="📝 Bildirim Türü..." data-en="📝 Notification Type...">📝 Bildirim Türü...</option>
                <option value="İstek/Talep" data-tr="🔵 İstek/Talep" data-en="🔵 Request/Demand">🔵 İstek/Talep</option>
                <option value="Öneri" data-tr="🟢 Öneri" data-en="🟢 Suggestion">🟢 Öneri</option>
                <option value="Şikayet" data-tr="🔴 Şikayet" data-en="🔴 Complaint">🔴 Şikayet</option>
                <option value="Diğer" data-tr="⚪ Diğer" data-en="⚪ Other">⚪ Diğer</option>
            </select>

            <select id="selectedCat" class="w-full bg-gray-50 border-2 border-gray-100 rounded-2xl py-4 px-4 font-bold text-gray-700 outline-none focus:border-blue-500 transition-all text-lg">
                <option value="Belirtilmedi" data-tr="⚠️ Kategori Seçiniz..." data-en="⚠️ Select Category...">⚠️ Kategori Seçiniz...</option>
                <optgroup label="📂 TEMİZLİK İŞLERİ" data-tr-label="📂 TEMİZLİK İŞLERİ" data-en-label="📂 CLEANING SERVICES">
                    <option value="Genel Temizlik" data-tr="🧹 Genel Temizlik" data-en="🧹 General Cleaning">🧹 Genel Temizlik</option>
                    <option value="Sarf Malz.(Sabun/Kağıt)" data-tr="🧻 Sarf Malz.(Sabun/Kağıt)" data-en="🧻 Consumables">🧻 Sarf Malz.(Sabun/Kağıt)</option>
                    <option value="Çöp Boşaltma" data-tr="🗑️ Çöp Boşaltma" data-en="🗑️ Waste Disposal">🗑️ Çöp Boşaltma</option>
                    <option value="Sıvı Dökülmesi / Hijyen" data-tr="💦 Sıvı Dökülmesi / Hijyen" data-en="💦 Spills / Hygiene">💦 Sıvı Dökülmesi / Hijyen</option>
                </optgroup>
                <optgroup label="🔧 TEKNİK ARIZA" data-tr-label="🔧 TEKNİK ARIZA" data-en-label="🔧 TECHNICAL FAULTS">
                    <option value="Elektrik / Aydınlatma" data-tr="💡 Elektrik / Aydınlatma" data-en="💡 Lighting / Electricity">💡 Elektrik / Aydınlatma</option>
                    <option value="İnternet / Wi-Fi" data-tr="📶 İnternet / Wi-Fi" data-en="📶 Internet / Wi-Fi">📶 İnternet / Wi-Fi</option>
                    <option value="Akıllı Tahta" data-tr="🖥️ Akıllı Tahta" data-en="🖥️ Smart Board">🖥️ Akıllı Tahta</option>
                    <option value="Isınma / Havalandırma" data-tr="🔥 Isınma / Havalandırma" data-en="🔥 Heating / HVAC">🔥 Isınma / Havalandırma</option>
                    <option value="Asansör Arızası" data-tr="🛗 Asansör Arızası" data-en="🛗 Elevator Issue">🛗 Asansör Arızası</option>
                    <option value="Sıra / Kapı Arızası" data-tr="🚪 Sıra / Kapı Arızası" data-en="🚪 Furniture / Door Fault">🚪 Sıra / Kapı Arızası</option>
                </optgroup>
            </select>

            <div class="space-y-2 text-center p-5 bg-blue-50 rounded-2xl border-2 border-blue-100">
                <p id="ratingLabel" class="text-[13px] font-black text-blue-600 uppercase tracking-widest" data-tr="⭐ SBF Memnuniyet Puanınız" data-en="⭐ SBF Satisfaction Rating">⭐ SBF Memnuniyet Puanınız</p>
                <div class="star-rating">
                    <button type="button" onclick="setRate(1)" class="star-btn"><i class="fa-solid fa-star"></i></button>
                    <button type="button" onclick="setRate(2)" class="star-btn"><i class="fa-solid fa-star"></i></button>
                    <button type="button" onclick="setRate(3)" class="star-btn"><i class="fa-solid fa-star"></i></button>
                    <button type="button" onclick="setRate(4)" class="star-btn"><i class="fa-solid fa-star"></i></button>
                    <button type="button" onclick="setRate(5)" class="star-btn"><i class="fa-solid fa-star"></i></button>
                </div>
                <input type="hidden" id="ratingValue" value="Seçilmedi">
            </div>

            <div class="relative border-2 border-dashed border-gray-200 rounded-2xl p-5 text-center bg-gray-50 cursor-pointer" onclick="document.getElementById('camera').click()">
                <input type="file" id="camera" accept="image/*" class="hidden" multiple>
                <i class="fa-solid fa-camera text-3xl text-gray-300 mb-1"></i>
                <p id="camStatus" class="text-[13px] font-black text-blue-500 uppercase tracking-widest" data-tr="📸 Fotoğraf Çek veya Seç" data-en="📸 Take or Select Photo">📸 Fotoğraf Çek veya Seç</p>
                <div id="photoList" class="mt-2 space-y-1 text-[12px] font-bold text-green-600 uppercase text-center"></div>
                <div id="loader" class="hidden w-6 h-6 border-4 border-blue-200 border-t-blue-600 rounded-full animate-spin mx-auto"></div>
            </div>

            <textarea id="note" rows="2" class="w-full border-2 border-gray-100 rounded-xl p-4 text-lg font-bold outline-none focus:border-blue-500 text-gray-700" placeholder="🖋️ Ekstra bir notunuz var mı?" data-tr-placeholder="🖋️ Ekstra bir notunuz var mı?" data-en-placeholder="🖋️ Any additional notes?"></textarea>

            <div class="space-y-3 pt-2">
                <button type="submit" id="submitBtn" class="w-full bg-blue-600 text-white font-black py-5 rounded-[2rem] shadow-xl uppercase tracking-widest active:scale-95 transition-all text-xl" data-tr="🚀 BİLDİRİMİ GÖNDER" data-en="🚀 SEND NOTIFICATION">
                    🚀 BİLDİRİMİ GÖNDER
                </button>
                <p class="text-center text-[12px] font-semibold text-blue-300 tracking-tight" data-tr="© 2026 SBF Bilgi İşlem Birimi. Tüm Hakları Saklıdır." data-en="© 2026 SBF IT Unit. All Rights Reserved.">
                    © 2026 SBF Bilgi İşlem Birimi. Tüm Hakları Saklıdır.
                </p>
            </div>
        </form>
    </div>

    <script>
        const TEL = "905427918023"; const API_KEY = "1014131234c99a74e9c994fb13e48dd2"; 
        let photoLinks = []; let currentRating = 0; let currentLang = 'tr';

        function setLang(lang) {
            currentLang = lang;
            document.getElementById('btn-tr').classList.toggle('active', lang === 'tr');
            document.getElementById('btn-en').classList.toggle('active', lang === 'en');
            document.querySelectorAll('[data-tr]').forEach(el => { el.innerText = el.getAttribute('data-' + currentLang); });
            document.querySelectorAll('[data-tr-placeholder]').forEach(el => { el.placeholder = el.getAttribute('data-' + currentLang + '-placeholder'); });
            document.querySelectorAll('optgroup').forEach(el => { el.label = lang === 'en' ? el.getAttribute('data-en-label') : el.getAttribute('data-tr-label'); });
            document.querySelectorAll('option').forEach(el => { const enT = el.getAttribute('data-en'); const trT = el.getAttribute('data-tr'); if(enT && trT) el.innerText = lang === 'en' ? enT : trT; });
            const rInp = document.getElementById('ratingValue'); if (currentRating === 0) rInp.value = currentLang === 'tr' ? "Seçilmedi" : "Not Selected";
        }

        function setIdentity(btn, val) { document.getElementById('selectedIdentity').value = val; document.querySelectorAll('.identity-btn').forEach(b => b.classList.remove('active-btn')); btn.classList.add('active-btn'); }
        function setRate(num) { const rInp = document.getElementById('ratingValue'); const stars = document.querySelectorAll('.star-btn'); if (currentRating === num) { currentRating = 0; rInp.value = currentLang === 'tr' ? "Seçilmedi" : "Not Selected"; } else { currentRating = num; rInp.value = num + (currentLang === 'tr' ? " Yıldız" : " Stars"); } stars.forEach((s, i) => i < currentRating ? s.classList.add('active') : s.classList.remove('active')); }
        
        function getTrackingNo() { 
            const n = new Date(); 
            const gun = String(n.getDate()).padStart(2,'0');
            const ay = String(n.getMonth()+1).padStart(2,'0');
            const yil = String(n.getFullYear()).substring(2);
            const saat = String(n.getHours()).padStart(2,'0');
            const dak = String(n.getMinutes()).padStart(2,'0');
            return `${gun}${ay}${yil}_${saat}${dak}`;
        }

        // FOTOĞRAF YÜKLEME FONKSİYONU GÜNCELLENDİ (SORUNSUZ YÜKLEME)
        document.getElementById('camera').addEventListener('change', async function(e) {
            const files = e.target.files; if (!files.length) return;
            document.getElementById('loader').classList.remove('hidden'); document.getElementById('submitBtn').disabled = true;
            
            for (let file of files) {
                try {
                    const compressedBlob = await compressImage(file);
                    const fd = new FormData();
                    fd.append('image', compressedBlob);
                    
                    const response = await fetch(`https://api.imgbb.com/1/upload?key=${API_KEY}`, { method: 'POST', body: fd });
                    const data = await response.json();
                    
                    if(data.success) {
                        photoLinks.push(data.data.url);
                        document.getElementById('photoList').innerHTML += `<p>${(currentLang === 'tr' ? "FOTOĞRAF YÜKLENDİ ✅" : "PHOTO UPLOADED ✅")} (${photoLinks.length})</p>`;
                    }
                } catch (err) { console.error("Yükleme hatası:", err); }
            }
            document.getElementById('loader').classList.add('hidden'); document.getElementById('submitBtn').disabled = false;
        });

        function compressImage(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');
                        const scale = img.width > 1200 ? 1200 / img.width : 1;
                        canvas.width = img.width * scale;
                        canvas.height = img.height * scale;
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        canvas.toBlob((blob) => resolve(blob), 'image/jpeg', 0.7);
                    };
                };
            });
        }

        document.getElementById('finalForm').onsubmit = (e) => {
            e.preventDefault(); const trackNo = getTrackingNo();
            document.getElementById('finalOverlay').style.display = 'flex';
            let photoStr = "";
            if(photoLinks.length > 0) { photoLinks.forEach((link, i) => { photoStr += `%0A👉 FOTO ${i+1}: ${link}`; }); }
            const msg = `🚨 SBF BİLDİRİM%0A🔢 REF: ${trackNo}%0A👤 KİMDEN: ${document.getElementById('selectedIdentity').value}%0A📍 KONUM: ${document.getElementById('loc').value}%0A📌 TÜR: ${document.getElementById('selectedType').value}%0A⚠️ KAT: ${document.getElementById('selectedCat').value}%0A⭐ PUAN: ${document.getElementById('ratingValue').value}%0A📝 NOT: ${document.getElementById('note').value}${photoStr}`;
            setTimeout(() => window.location.href = `https://wa.me/${TEL}?text=${msg}`, 1500);
        };
    </script>
</body>
</html>
